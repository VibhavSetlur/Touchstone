name: release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  pypi:
    name: Publish to PyPI (with Sigstore + SLSA provenance)
    runs-on: ubuntu-latest
    permissions:
      id-token: write    # for OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv build packages/touchstone-core packages/touchstone-mcp packages/touchstone-cli
      - uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    name: Publish container images
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push MCP
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/touchstone-mcp.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/touchstone-mcp:${{ github.ref_name }}
          sbom: true
          provenance: mode=max
