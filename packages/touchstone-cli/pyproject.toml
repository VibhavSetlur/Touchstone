[project]
name = "touchstone-cli"
version = "0.1.0"
description = "Touchstone CLI — local QA tooling for data engineers."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "touchstone-core",
    "click>=8.1",
    "rich>=13.7",
    "questionary>=2.0",
]

[project.scripts]
touchstone = "touchstone_cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/touchstone_cli"]
