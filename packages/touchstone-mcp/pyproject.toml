[project]
name = "touchstone-mcp"
version = "0.1.0"
description = "Touchstone MCP server — Model Context Protocol bridge for AI assistants."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "touchstone-core",
    "mcp>=1.2",
    "anyio>=4.4",
    "click>=8.1",
]

[project.scripts]
touchstone-mcp = "touchstone_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/touchstone_mcp"]
