[project]
name = "touchstone-core"
version = "0.1.0"
description = "Touchstone core — connectors, QA capabilities, security primitives."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "The Touchstone Contributors"}]
keywords = ["mcp", "qa", "data-quality", "database", "ai", "security", "pii"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
# Minimal dependencies — only what touchstone-core directly imports at the
# top level. Engine-specific drivers go in optional-dependencies. Heavy
# transitive deps (cryptography, presidio, transformers) are also extras.
dependencies = [
    "sqlglot>=25.0",
    "sqlalchemy>=2.0",
    "rich>=13.7",
    "tomli-w>=1.0",
    "keyring>=25.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
mysql = ["pymysql>=1.1"]
snowflake = ["snowflake-connector-python>=3.10"]
bigquery = ["google-cloud-bigquery>=3.24"]
mongodb = ["pymongo>=4.8"]
databricks = ["databricks-sql-connector>=3.3"]
redshift = ["redshift-connector>=2.1"]
trino = ["trino>=0.328"]
clickhouse = ["clickhouse-connect>=0.7"]
duckdb = ["duckdb>=1.0"]
pii = ["presidio-analyzer>=2.2", "spacy>=3.7"]
pii-local-ner = ["transformers>=4.40", "torch>=2.0"]
web = ["playwright>=1.45", "cryptography>=42.0"]
llm-anthropic = ["anthropic>=0.40"]
llm-openai = ["openai>=1.50"]
llm-vertex = ["google-genai>=0.4"]
llm-bedrock = ["boto3>=1.34"]
# Convenience bundles
quickstart = ["touchstone-core[postgres,duckdb,web]"]
all = [
    "touchstone-core[postgres,mysql,snowflake,bigquery,mongodb,databricks,redshift,trino,clickhouse,duckdb,pii,web,llm-anthropic,llm-openai]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/touchstone"]
