[project]
name = "touchstone-core"
version = "0.1.0"
description = "Touchstone core — connectors, QA capabilities, security primitives."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "sqlglot>=25.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "rich>=13.7",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "keyring>=25.0",
    "blake3>=0.4",
    "tdigest>=0.5",
    "datasketch>=1.6",          # HyperLogLog
    "casbin>=1.36",             # policy engine
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
mysql = ["pymysql>=1.1"]
snowflake = ["snowflake-connector-python>=3.10"]
bigquery = ["google-cloud-bigquery>=3.24"]
mongodb = ["pymongo>=4.8"]
databricks = ["databricks-sql-connector>=3.3"]
redshift = ["redshift-connector>=2.1"]
trino = ["trino>=0.328"]
clickhouse = ["clickhouse-connect>=0.7"]
duckdb = ["duckdb>=1.0"]
pii = ["presidio-analyzer>=2.2", "spacy>=3.7"]
web = ["playwright>=1.45"]
llm-anthropic = ["anthropic>=0.40"]
llm-openai = ["openai>=1.50"]
llm-vertex = ["google-genai>=0.4"]
llm-bedrock = ["boto3>=1.34"]
all = [
    "touchstone-core[postgres,mysql,snowflake,bigquery,mongodb,databricks,redshift,trino,clickhouse,duckdb,pii,web,llm-anthropic,llm-openai]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/touchstone"]
