[project]
name = "touchstone-workspace"
version = "0.1.0"
description = "Touchstone — the QA copilot's copilot. Workspace root."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "The Touchstone Contributors"}]

[tool.uv.workspace]
members = [
    "packages/touchstone-core",
    "packages/touchstone-mcp",
    "packages/touchstone-cli",
]

[tool.uv.sources]
touchstone-core = {workspace = true}
touchstone-mcp = {workspace = true}
touchstone-cli = {workspace = true}

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "duckdb>=1.0",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["packages/touchstone-ui", "packages/touchstone-github"]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle, pyflakes
    "I",               # isort
    "B",               # bugbear
    "UP",              # pyupgrade
    "ASYNC",           # async-correctness
    "S",               # bandit (security)
    "RUF",             # ruff-specific
    "SIM",             # simplify
    "TCH",             # type-checking imports
    "ARG",             # unused arguments
    "PTH",             # use pathlib
]
ignore = [
    "S101",  # assert in tests is fine
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "ARG"]
"packages/*/src/touchstone/security/gateway.py" = []  # extra-strict here

[tool.pyright]
include = ["packages/*/src"]
exclude = ["**/node_modules", "**/__pycache__", "packages/touchstone-ui", "packages/touchstone-github"]
strict = ["packages/*/src/touchstone"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"

[tool.pytest.ini_options]
testpaths = ["tests", "packages/*/tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: tests that require docker compose stack",
    "slow: tests slower than ~1s",
    "security: tests asserting trust-boundary invariants",
]

[tool.coverage.run]
source = ["packages/touchstone-core/src", "packages/touchstone-mcp/src", "packages/touchstone-cli/src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "def __repr__",
]
